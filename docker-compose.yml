version: "3.9"
services:
  lanjanitor:
    image: lanjanitor:latest
    container_name: lanjanitor
    build: .
    # Mount local app directory into container for live code updates (dev only)
    volumes:
      - ./app:/app
    ports:
      - "80:5000"
    restart: unless-stopped
    environment:
      # Set a strong secret key in production!
      - SECRET_KEY=changeme
    # Uncomment below for persistent DB storage outside container
    #    - ./data/lanjanitor.db:/app/lanjanitor.db
